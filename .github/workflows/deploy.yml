name: Deploy ClientOS to production

# Only a push to `production` deploys. Pushes to any other branch (main,
# feature branches, PRs) only run tests — never touches os.rohitkumarseo.com.
on:
  push:
    branches: [production]

jobs:
  # ---------------------------------------------------------------------------
  # Everything here must pass before a single byte reaches production. A
  # failure in this job stops the workflow — the deploy job below never runs.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    # This test suite is an integration suite — it truncates real tables via
    # Prisma against a real database (see src/lib/test-db.ts), not mocks. A
    # placeholder DATABASE_URL is only good enough for `prisma generate`
    # (which just parses the string) and `next build` (no DB access at build
    # time, per next.config.ts having no static generation touching data) —
    # the actual test step needs a live, migrated database to connect to.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: clientos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: "mysql://root@127.0.0.1:3306/clientos_test?ssl=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Apply migrations to the ephemeral test database
        run: npx prisma migrate deploy

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Builds the image, pushes it to GHCR (private-repo-owned, so no separate
  # registry credentials needed on the VPS), then asks the Hostinger API to
  # pull it and recreate the container. No SSH involved.
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clientos:latest
            ghcr.io/${{ github.repository_owner }}/clientos:${{ github.sha }}

      - name: Redeploy on the VPS via Hostinger API
        run: |
          status=$(curl -s -o /tmp/hostinger-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${{ secrets.HOSTINGER_VPS_ID }}/docker/clientos/update")
          echo "Hostinger API responded with HTTP $status"
          cat /tmp/hostinger-response.json
          if [ "$status" -ge 300 ]; then
            echo "Redeploy request failed — see response above."
            exit 1
          fi
