# Deployed on the VPS as the "clientos" Docker Compose project via the
# Hostinger API (VPS_createNewProjectV1 / VPS_updateProjectV1). All secret
# values come from that project's own environment settings, never from this
# file or from git — see docs/deployment.md for the required variable list.
#
# Traefik discovers this via labels (matching the existing traefik project's
# `providers.docker` setup already running on this VPS) — no new reverse
# proxy config needed.
services:
  app:
    image: ghcr.io/${GHCR_OWNER}/clientos:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://clientos:${DB_PASSWORD}@db:3306/clientos_prod?ssl=false
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - NEXT_PUBLIC_SITE_URL=https://os.rohitkumarseo.com
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    labels:
      - traefik.enable=true
      - traefik.http.routers.clientos.rule=Host(`os.rohitkumarseo.com`)
      - traefik.http.routers.clientos.entrypoints=websecure
      - traefik.http.routers.clientos.tls.certresolver=letsencrypt
      - traefik.http.services.clientos.loadbalancer.server.port=3000
    ports:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  # Isolated production database — its own container, its own volume, never
  # shared with clientos_dev or any other project on this VPS.
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=clientos_prod
      - MARIADB_USER=clientos
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - clientos_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clientos_db_data:
